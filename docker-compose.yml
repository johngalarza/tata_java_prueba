services:

  cliente-db:
    image: postgres:16
    environment:
      POSTGRES_DB: cliente_db
      POSTGRES_USER: banco
      POSTGRES_PASSWORD: banco
    volumes:
      - cliente-data:/var/lib/postgresql/data

  cuenta-db:
    image: postgres:16
    environment:
      POSTGRES_DB: cuenta_db
      POSTGRES_USER: banco
      POSTGRES_PASSWORD: banco
    volumes:
      - cuenta-data:/var/lib/postgresql/data

  cliente-service:
    build: ./cliente-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - cliente-db

  cuenta-service:
    build: ./cuenta-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - cuenta-db

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  cliente-data:
  cuenta-data: